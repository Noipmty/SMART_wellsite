[project]
name = "smart-wellsite"
version = "0.1.0"
description = "智慧井场多智能体系统：五层架构·10 Agent·3 阶段落地·LangGraph + FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "zhihui team"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.0",
    "prometheus-client>=0.20.0",
    "mysql-connector-python>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# 阶段一用（LangGraph 编排器）
langgraph = [
    "langgraph>=0.2.50",
    "langchain-core>=0.2.40",
    "langsmith>=0.1.140",
]
# 阶段二用（知识图谱 + 向量库 + 对象存储）
phase2 = [
    "neo4j>=5.20.0",
    "pymilvus>=2.4.10",
    "minio>=7.2.7",
    "psycopg2-binary>=2.9.9",
]
# 阶段二用（视频智能 YOLO）
vision = [
    "ultralytics>=8.3.0",
]
# 阶段一用（TDengine 时序数据库）
tdengine = [
    "taospy>=2.7.16",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "agents*", "libs*", "sim*", "configs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
